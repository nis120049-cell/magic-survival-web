<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sky">

        <div class="sun"></div>

        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>

        <div class="ground"></div>

        <div class="sakura-tree tree-1">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

        <div class="sakura-tree tree-2">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

    </div>


    <div class="game">

        <header class="top-bar">

            <div>
                ❤️ <span id="lives">3</span>
            </div>

            <div>
                LEVEL <span id="level">1</span>
            </div>

            <div>
                ⭐ <span id="score">0</span>
            </div>

        </header>

        <main class="game-card">

            <h1>Math Adventure</h1>

            <p>
                Soal
                <span id="questionNumber">1</span>
                /
                <span id="totalQuestions">100</span>
            </p>

            <div id="question" class="question">
                Memuat soal...
            </div>

            <div id="answers" class="answers"></div>

            <p id="message"></p>

        </main>
